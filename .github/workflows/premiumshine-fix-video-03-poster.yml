name: Fix PremiumShine video 03 preview
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/premiumshine-fix-video-03-poster.yml"
permissions:
  contents: write
jobs:
  fix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Choose a representative frame from video 03
        run: |
          set -euo pipefail
          video="assets/videos/premiumshine-video-03.mp4"
          poster="assets/posters/premiumshine-video-03.jpg"
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$video")
          timestamp=$(python -c "print(round(float('$duration') * 0.30, 3))")
          ffmpeg -hide_banner -loglevel error -ss "$timestamp" -i "$video" -frames:v 1 -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:color=0x120b0e" -q:v 2 -y "$poster"
          test -s "$poster"
      - name: Commit corrected video 03 preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/posters/premiumshine-video-03.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Correct preview frame for PremiumShine video 03"
          git push
